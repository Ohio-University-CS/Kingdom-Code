name: Validate Godot Project

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.6.1

      - name: Verify project loads
        run: |
          godot --headless --path . --quit
